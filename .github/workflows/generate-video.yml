      - name: Upload the scores and a frame of every clip
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reel-grounding-check
          path: |
            output/grounding/validation.json
            output/grounding/frames/*.jpg
          retention-days: 14
          if-no-files-found: warn

