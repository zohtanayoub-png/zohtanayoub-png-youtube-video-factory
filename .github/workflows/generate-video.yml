  #  ninety-two strips loses eighty-eight of them off the front.
  # -------------------------------------------------------------------
  reel-strips:
    name: Draw the measured windows so they can be labelled
    if: inputs.task == 'reel-strips'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Least privilege: a probe reads the code and writes nothing back.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
          pip install onnxruntime
      - name: Restore the cached model files
        uses: actions/cache@v4
        with:
          path: .cache
          key: vidfactory-reel-cache-v1
      - name: Measure
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PROBE_QUERY: ${{ inputs.probe_query }}
        run: |
          set -euo pipefail
          mkdir -p output/holdout
          # One band of the sharpness axis at a time. The log hands back about
          # 828KB however much is printed, so drawing the whole axis at full
          # size delivers only whatever happened to print last - the first
          # strips run emitted 33 and 18 arrived. probe_query carries the band
          # as "LOW HIGH"; blank means the low end, which is where the floor is.
          BAND="${PROBE_QUERY:-0.0 0.25}"
          read -r LOW HIGH <<< "$BAND"
          python tools/reel_holdout_check.py strips --clips 1 \
            --sharpness-min "$LOW" --sharpness-max "$HIGH" \
            --strip-height 220 --strip-quality 9 \
            --out output/holdout/strips.json | tee output/holdout/strips-summary.txt
      - name: Report
        if: always()
        run: |
          # Deliberately not the whole file. The sharpness run pushed 17MB at
          # a 1MB step summary and GitHub discarded the lot; the strips are
          # base64 and belong in the log, not in a markdown summary.
          {
            echo "## Window strips for labelling"
            echo '```'
            grep -c FRAME-BEGIN output/holdout/strips-summary.txt || true
            echo "strips emitted; the pictures are in the job log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the scores
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reel-strips
          path: output/holdout/*
          retention-days: 14
          if-no-files-found: warn

  # -------------------------------------------------------------------
  #  Candidate local-focus metrics on the ninety-two windows already
  #  measured and labelled. Searches nothing, spends no query.
  # -------------------------------------------------------------------
  reel-focus:
    name: Local focus measures on the same windows
    if: inputs.task == 'reel-focus'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Least privilege: a probe reads the code and writes nothing back.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
          pip install onnxruntime
      - name: Restore the cached model files
        uses: actions/cache@v4
        with:
          path: .cache
          key: vidfactory-reel-cache-v1
      - name: Measure
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PROBE_QUERY: ${{ inputs.probe_query }}
        run: |
          set -euo pipefail
          mkdir -p output/holdout
          # No search and no new footage: the sources are fetched by provider
          # id and the frames are the same sampled positions already measured.
          python tools/reel_holdout_check.py focus --clips 1 \
            --out output/holdout/focus.json | tee output/holdout/focus-summary.txt
      - name: Report
        if: always()
        run: |
          # Deliberately not the whole file. The sharpness run pushed 17MB at
          # a 1MB step summary and GitHub discarded the lot; the strips are
          # base64 and belong in the log, not in a markdown summary.
          {
            echo "## Local focus measures"
            echo '```'
            grep -c FRAME-BEGIN output/holdout/focus-summary.txt || true
            echo "strips emitted; the pictures are in the job log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the scores
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reel-focus
          path: output/holdout/*
          retention-days: 14
          if-no-files-found: warn

  # -------------------------------------------------------------------
  #  Held-out measurement, part two: the whole gate on fresh piles, after
  #  the calibration above has been acted on. Precision and recall, overall
  #  and per food and per state.
  # -------------------------------------------------------------------
  reel-holdout-final:
    name: The gate on footage it has never seen
    if: inputs.task == 'reel-holdout-final'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Least privilege: a probe reads the code and writes nothing back.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
          pip install onnxruntime
      - name: Restore the cached model files
        uses: actions/cache@v4
        with:
          path: .cache
          key: vidfactory-reel-cache-v1
      - name: Measure
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          set -euo pipefail
          python tools/reel_holdout_check.py holdout --clips 6 \
            --out output/holdout/holdout.json
      - name: Report
        if: always()
        run: |
          {
            echo "## Held-out benchmark"
            echo '```json'
            cat output/holdout/holdout.json || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the scores
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reel-holdout-final
          path: output/holdout/holdout.json
          retention-days: 14
          if-no-files-found: warn

  reel:
    name: Render one vertical reel
    if: inputs.task == 'reel'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Least privilege: the reel reads the code and writes nothing back.
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install FFmpeg and eSpeak NG
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg espeak-ng

      - name: Install caption fonts
        continue-on-error: true
        run: |
          sudo apt-get install -y --no-install-recommends \
            fonts-inter fonts-noto-core fonts-noto-color-emoji fonts-liberation2 || \
            sudo apt-get install -y --no-install-recommends fonts-liberation2
          fc-cache -f >/dev/null 2>&1 || true

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
          # onnxruntime for the frame scoring, and the project's own dev
          # extra for the pre-flight safety check. Installing bare pytest is
          # not enough: addopts carries --timeout=900, so without
          # pytest-timeout pytest exits 4 on an unknown option.
          pip install onnxruntime
          pip install -e ".[dev]"

      - name: Install Kokoro (the natural Spanish voice)
        # Apache-2.0, model and code, so it is usable commercially - which is
        # why it is the default rather than merely the nicest sounding. CPU
        # torch on purpose: the runner has no GPU and the full wheel is about
        # 2.5 GB of download for nothing.
        continue-on-error: true
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends libespeak-ng1 || true
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install "kokoro>=0.9" "misaki[es]"
          python -c "import json; from vidfactory.reels.voice import licence_report; print(json.dumps(licence_report()['kokoro'], indent=2))"

      - name: Restore the cached model and voice files
        uses: actions/cache@v4
        with:
          path: .cache
          key: vidfactory-reel-cache-v1

      - name: Check the script before spending a render on it
        run: python -m pytest -q tests/test_diabetes_reels.py

      - name: Compare the two voices on one script
        # Same words, both engines, so what is measured is the voice and
        # nothing else. Audio only - no video is rendered.
        if: ${{ inputs.reel_tts == 'compare' }}
        env:
          REEL_TOPIC: ${{ inputs.topic }}
          REEL_SECONDS: ${{ inputs.reel_seconds }}
        run: |
          set -euo pipefail
          python -m vidfactory reel-voice-check \
            --topic "$REEL_TOPIC" \
            --seconds "$REEL_SECONDS" \
            --engines kokoro,piper \
            --output output/voice-check
          {
            echo "## Voice comparison"
            echo '```json'
            cat output/voice-check/voice_check.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate the reel
        if: ${{ inputs.reel_tts != 'compare' }}
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          REEL_TOPIC: ${{ inputs.topic }}
          REEL_SECONDS: ${{ inputs.reel_seconds }}
          REEL_ITEMS: ${{ inputs.number_of_items }}
          REEL_VOICE: ${{ inputs.voice }}
          REEL_TTS: ${{ inputs.reel_tts }}
          REEL_MODE: ${{ inputs.generation_mode }}
        run: |
          set -euo pipefail
          ITEMS="$REEL_ITEMS"
          [ "$ITEMS" = "Automatic" ] && ITEMS=0
          VOICE="$REEL_VOICE"
          [ "$VOICE" = "Automatic" ] && VOICE=""
          python -m vidfactory reel \
            --topic "$REEL_TOPIC" \
            --seconds "$REEL_SECONDS" \
            --items "$ITEMS" \
            --voice "$VOICE" \
            --tts "$REEL_TTS" \
            --mode "$REEL_MODE" \
            --output output/reels

      - name: Report what was produced
        if: always()
        run: |
          set -euo pipefail
          DIR=$(ls -dt output/reels/*/ 2>/dev/null | head -1 || true)
          [ -z "$DIR" ] && { echo "no reel directory"; exit 0; }
          {
            echo "## Reel"
            echo '```'
            ffprobe -v error -show_entries \
              stream=codec_name,width,height,avg_frame_rate:format=duration \
              -of default=nw=1 "$DIR/reel.mp4" || true
            echo '```'
            echo "### Quality report"
            echo '```json'
            cat "$DIR/reel_quality_report.json"
            echo '```'
            echo "### Script"
            echo '```'
            cat "$DIR/guion.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # And to stdout, because a step summary cannot be read back through
          # the API: the report existed and could not be looked at, which is
          # the same way the presentation aggregates were lost.
          echo "=== reel_quality_report.json ==="
          cat "$DIR/reel_quality_report.json"
          echo "=== guion.txt ==="
          cat "$DIR/guion.txt"

      - name: Inspect real frames from the finished reel
        if: always()
        continue-on-error: true
        run: python tools/inspect_reel_frames.py output/reels

      - name: Upload the reel and everything beside it
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diabetes-reel
          path: |
            output/reels/*/reel.mp4
            output/reels/*/subtitles.srt
            output/reels/*/subtitles.ass
            output/reels/*/guion.txt
            output/reels/*/caption.txt
            output/reels/*/metadata.json
            output/reels/*/fuentes.json
            output/reels/*/reel_quality_report.json
            output/reels/*/script.json
            output/voice-check/voice_check.json
            output/voice-check/*.wav
          retention-days: 30
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  #  INSTRUCTION GROUNDING PROBE
  #  Run 44 grounded 93 of 93 shots and shipped a dragonfly on a windowpane
  #  under "do not block the window" and metallic ribbons under "paint the
  #  trim". Entity presence cannot see either: both frames contain their
  #  object. This scores the whole visual claim against the searches that
  #  reproduce those exact failures, and against the claim's own valid
  #  searches, so the layer is measured before a render is spent on it.
  # ---------------------------------------------------------------------------
  instruction-check:
    name: Measure the instruction-grounding probes
    if: inputs.task == 'instruction-check'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Least privilege: a probe reads the code and writes nothing back.
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
          pip install onnxruntime

      - name: Restore the cached model files
        uses: actions/cache@v4
        with:
          path: .cache
          key: vidfactory-cache-Automatic-visual-v2

      - name: Measure
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          # Through the environment rather than interpolated into the script,
          # so a dispatch input is data and never shell.
          PROBE_CLAIMS: ${{ inputs.probe_entities }}
          PROBE_QUERY: ${{ inputs.probe_query }}
          PROBE_MODEL: ${{ inputs.probe_model }}
          PROBE_RAW: ${{ inputs.probe_raw }}
        run: |
          [ "$PROBE_RAW" = "true" ] && RAW=--raw || RAW=""
          python -m vidfactory instruction-check \
            --samples 6 --json-out instruction-calibration.json \
            --claims "$PROBE_CLAIMS" \
            --probe-query "$PROBE_QUERY" \
            --model-repo "$PROBE_MODEL" \
            $RAW \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload the raw scores
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instruction-calibration
          path: instruction-calibration.json
          retention-days: 30
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  #  PREMIUM CANDIDATE ANALYSIS
  #  final_shot_premium_visual_ratio sat at 0.39 against a 0.60 target and the
  #  only way to find out why was a thirty minute render. This searches the
  #  provider as the pipeline does, inspects the candidates on preview stills,
  #  and reports the premium ratio of what a ranker would actually select -
  #  before and after a proposed change - with the reason every rejected clip
  #  failed, so a ranking change is argued from a predicted number.
  # ---------------------------------------------------------------------------
  premium-check:
    name: Analyse the candidate pool
    if: inputs.task == 'premium-check'
    # Least privilege: a probe reads the code and writes nothing back.
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
          pip install onnxruntime

      - name: Restore the cached model files
        uses: actions/cache@v4
        with:
          path: .cache
          key: vidfactory-cache-Automatic-visual-v2

      - name: Analyse
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          python tools/premium_check.py \
            --per-query 15 --pages 2 --select 40 \
            --json-out premium-candidates.json \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload the raw rows
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: premium-candidates
          path: premium-candidates.json
          retention-days: 30
          if-no-files-found: warn
