# =============================================================================
#  GENERATE ONE VIDEO
#  Runs the whole pipeline in the cloud. Your computer does not need to be on.
#  Start it from:  Actions -> Generate Video -> Run workflow
# =============================================================================
name: Generate Video

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Video topic (leave empty to pick one automatically)"
        required: false
        type: string
        default: ""
      duration_minutes:
        description: "Target length in minutes (2 is a quick test render)"
        required: false
        type: choice
        default: "20"
        options: ["2", "5", "10", "15", "20", "30"]
      voice:
        description: "Narration voice"
        required: false
        type: choice
        default: "en_US-hfc_female-medium"
        options:
          - en_US-hfc_female-medium
          - en_US-amy-medium
          - en_US-lessac-medium
          - en_US-kristin-medium
          - en_US-ryan-medium
          - en_US-hfc_male-medium
      subtitles:
        description: "Generate an .srt subtitle file"
        required: false
        type: boolean
        default: true
      burn_in_subtitles:
        description: "Burn the subtitles into the picture (usually leave off)"
        required: false
        type: boolean
        default: false
      upload_to_youtube:
        description: "Upload to YouTube when it is finished"
        required: false
        type: boolean
        default: false
      privacy_status:
        description: "YouTube privacy (only used when uploading)"
        required: false
        type: choice
        default: "private"
        options: [private, unlisted, public]

  # Lets autopilot.yml reuse this exact job instead of duplicating it.
  workflow_call:
    inputs:
      topic:
        required: false
        type: string
        default: ""
      # Free-form here so autopilot can pass whatever config.yaml says.
      duration_minutes:
        required: false
        type: string
        default: "20"
      voice:
        required: false
        type: string
        default: "en_US-hfc_female-medium"
      subtitles:
        required: false
        type: boolean
        default: true
      burn_in_subtitles:
        required: false
        type: boolean
        default: false
      upload_to_youtube:
        required: false
        type: boolean
        default: false
      privacy_status:
        required: false
        type: string
        default: "private"
    secrets:
      PEXELS_API_KEY:
        required: false
      PIXABAY_API_KEY:
        required: false
      YOUTUBE_CLIENT_ID:
        required: false
      YOUTUBE_CLIENT_SECRET:
        required: false
      YOUTUBE_REFRESH_TOKEN:
        required: false

# Least privilege: the job only needs to read the code and commit the small
# JSON history files back to the repository.
permissions:
  contents: write

# Never let two renders write the history at the same time.
concurrency:
  group: video-generation
  cancel-in-progress: false

jobs:
  render:
    name: Render long-form video
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install FFmpeg
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -version | head -1
          ffprobe -version | head -1

      - name: Install eSpeak NG (narration fallback)
        run: sudo apt-get install -y --no-install-recommends espeak-ng

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Install the optional visual model runtime
        # Frame inspection always runs. ONNX Runtime is what additionally
        # enables the CLIP concept scoring; without it the pipeline falls back
        # to pixel statistics and records that in the editorial report.
        continue-on-error: true
        run: pip install "onnxruntime>=1.17"

      - name: Restore the cached voice and model files
        uses: actions/cache@v4
        with:
          path: .cache
          key: vidfactory-cache-${{ inputs.voice }}-visual-v2
          restore-keys: |
            vidfactory-cache-

      - name: Start from a clean output tree
        # A job re-run reuses the workflow run number, so guarantee that
        # nothing from an earlier attempt can be picked up.
        run: rm -rf output work

      - name: Show free disk space
        run: df -h / | tail -1

      - name: Check the environment
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: python -m vidfactory doctor || true

      - name: Generate the video
        id: generate
        # Workflow inputs are passed through the environment rather than
        # interpolated into the shell, so a topic can never inject a command.
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          INPUT_TOPIC: ${{ inputs.topic }}
          INPUT_DURATION: ${{ inputs.duration_minutes }}
          INPUT_VOICE: ${{ inputs.voice }}
          INPUT_SUBTITLES: ${{ inputs.subtitles }}
          INPUT_BURN_IN: ${{ inputs.burn_in_subtitles }}
          INPUT_UPLOAD: ${{ inputs.upload_to_youtube }}
          INPUT_PRIVACY: ${{ inputs.privacy_status }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          if [ "${INPUT_UPLOAD}" = "true" ]; then
            pip install -r requirements-youtube.txt
          fi
          python -m vidfactory generate \
            --topic "${INPUT_TOPIC}" \
            --duration "${INPUT_DURATION}" \
            --voice "${INPUT_VOICE}" \
            --subtitles "${INPUT_SUBTITLES}" \
            --burn-in "${INPUT_BURN_IN}" \
            --upload "${INPUT_UPLOAD}" \
            --privacy "${INPUT_PRIVACY}" \
            --run-id "run-${RUN_NUMBER}" \
            --github-output

      - name: Summarize the result
        if: always()
        env:
          VIDEO_TITLE: ${{ steps.generate.outputs.title }}
          VIDEO_SECONDS: ${{ steps.generate.outputs.duration_seconds }}
          VIDEO_YOUTUBE_ID: ${{ steps.generate.outputs.youtube_id }}
          GENERATION_ID: ${{ steps.generate.outputs.generation_id }}
        run: |
          {
            echo "## Video generation"
            echo ""
            if [ -n "${VIDEO_TITLE:-}" ]; then
              echo "**Title:** ${VIDEO_TITLE}"
              echo ""
              echo "**Length:** ${VIDEO_SECONDS} seconds"
              echo ""
              echo "**Generation:** \`${GENERATION_ID}\`"
            echo ""
            if [ -n "${VIDEO_YOUTUBE_ID:-}" ]; then
                echo "**YouTube:** https://www.youtube.com/watch?v=${VIDEO_YOUTUBE_ID}"
              else
                echo "Not uploaded. Download the artifact below."
              fi
            else
              echo "Generation did not complete. Check the log above."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report the editorial and visual quality measurements
        # The artifact is not always convenient to open, and these numbers are
        # the point of the run. Printing them into the job summary means the
        # quality of a render can be reviewed from the run page alone.
        if: always()
        env:
          OUTPUT_DIR: ${{ steps.generate.outputs.output_dir }}
        run: |
          # tee, not a plain redirect: the same table in the job log makes a
          # render reviewable without downloading the artifact.
          python - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, os, pathlib

          directory = pathlib.Path(os.environ.get("OUTPUT_DIR") or "")
          report = directory / "editorial_quality_report.json"
          if not report.exists():
              print("\n_No editorial quality report was produced._")
              raise SystemExit(0)
          data = json.loads(report.read_text())

          print("\n### Editorial and visual quality\n")
          print("| Measurement | Value |")
          print("| --- | --- |")
          for key in (
              "visual_analysis_model",
              "visual_analysis_frame_count",
              "visually_inspected_clip_count",
              "visual_semantic_match_average",
              "low_relevance_clip_count",
              "premium_visual_ratio",
              "empty_room_clip_count",
              "plastic_covered_clip_count",
              "floor_plan_clip_count",
              "renovation_clip_count",
              "people_dominant_clip_count",
              "dark_clip_count",
              "causal_promise_alignment_score",
              "unique_source_videos",
              "source_video_reuse_count",
              "shot_count",
              "creator_diversity",
              "visual_analysis_seconds",
              "artifact_provenance_passed",
          ):
              if key in data:
                  print(f"| `{key}` | {data[key]} |")

          print("\n**Per-section causal alignment**\n")
          print("| # | Heading | Score | Why it passed |")
          print("| --- | --- | --- | --- |")
          for section in data.get("section_alignment", [])[:30]:
              print(
                  f"| {section['index']} | {section['heading'][:48]} | "
                  f"{section['causal_promise_alignment_score']} | {section['why'][:90]} |"
              )

          sources = directory / "video_sources.json"
          if sources.exists():
              clips = json.loads(sources.read_text()).get("clips", [])
              print("\n**Selected footage, judged on its own frames**\n")
              print("| Source | Semantic | Premium | Frames | Flags |")
              print("| --- | --- | --- | --- | --- |")
              for clip in clips[:40]:
                  visual = clip.get("visual") or {}
                  flags = ", ".join(
                      f"{k} {v}" for k, v in (visual.get("flags") or {}).items()
                  ) or "-"
                  print(
                      f"| {clip['provider']}:{clip['provider_id']} | "
                      f"{visual.get('semantic_match', '-')} | "
                      f"{visual.get('premium_visual_score', '-')} | "
                      f"{visual.get('frame_count', 0)} | {flags[:70]} |"
                  )

          failed = [c for c in data.get("checks", []) if not c["passed"]]
          if failed:
              print("\n**Checks not passed**\n")
              for check in failed:
                  print(f"- `{check['name']}` ({check['severity']}): {check['detail']}")
          PY

      # The artifact is scoped to this generation's own directory. The
      # previous "output/**" wildcard would sweep up every generation present
      # on disk, so a stale run's script.txt could be packaged next to a
      # different run's video.
      - name: Upload the finished video and files
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ steps.generate.outputs.generation_id }}
          path: ${{ steps.generate.outputs.output_dir }}
          retention-days: 14
          if-no-files-found: error
          compression-level: 0

      - name: Upload the text files only (kept longer)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: metadata-${{ steps.generate.outputs.generation_id }}
          path: |
            ${{ steps.generate.outputs.output_dir }}/script.txt
            ${{ steps.generate.outputs.output_dir }}/metadata.json
            ${{ steps.generate.outputs.output_dir }}/video_sources.json
            ${{ steps.generate.outputs.output_dir }}/editorial_quality_report.json
            ${{ steps.generate.outputs.output_dir }}/artifact_manifest.json
          retention-days: 60
          if-no-files-found: warn

      - name: Save the history back to the repository
        if: success()
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state
          if git diff --cached --quiet; then
            echo "No history changes to commit."
            exit 0
          fi
          git commit -m "chore(history): record run ${RUN_NUMBER}"
          # Another run may have pushed while this one was rendering.
          for attempt in 1 2 3 4 5; do
            if git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "History saved."
              exit 0
            fi
            echo "Push attempt ${attempt} failed; retrying..."
            sleep $((attempt * 4))
          done
          echo "::warning::Could not save the history this run. The video itself is fine."

      - name: Remove temporary footage
        if: always()
        run: |
          rm -rf work
          df -h / | tail -1
